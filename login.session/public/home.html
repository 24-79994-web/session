<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">MyApp</a>
      <button id="logoutBtn" class="btn btn-outline-light btn-sm">Logout</button>
    </div>
  </nav>

  <div class="container my-5">
    <div class="bg-white p-5 rounded shadow-sm">
      <h1 class="display-5">Hello, <span id="userDisplay" class="text-primary">Loading...</span>!</h1>
      <p class="lead mt-3">Welcome to your home dashboard. Authentication was successful through SQLite DB integration.</p>
      <hr>
      <p class="text-muted">You are logged into a protected session.</p>
    </div>
  </div>

  <script>
    // Verify user session on load
    async function checkAuth() {
      try {
        const res = await fetch('/api/user');
        if (!res.ok) {
          window.location.href = '/login.html';
          return;
        }
        const data = await res.json();
        document.getElementById('userDisplay').textContent = data.user.username;
      } catch (err) {
        window.location.href = '/login.html';
      }
    }

    // Logout handling
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/login.html';
    });

    checkAuth();
  </script>
</body>
</html>
